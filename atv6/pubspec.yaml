name: portal_cidadao_fiscalizacao_publica
description: "Portal Cidadao - app de transparencia com dados da Camara dos Deputados."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  http: ^1.2.2          # Consumo da API da Camara dos Deputados
  sqflite: ^2.3.3       # Persistencia local (favoritos offline)
  sqflite_common_ffi: ^2.3.3  # Suporte a SQLite em Windows/Linux (desktop)
  path: ^1.9.0          # Montagem do caminho do banco local
  intl: ^0.19.0         # Formatacao de moeda (R$) e datas

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
